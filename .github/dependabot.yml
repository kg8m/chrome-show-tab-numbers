# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Asia/Tokyo
    # Wait for new releases to settle before updating because Dependabot PRs are merged automatically. Security updates
    # aren’t delayed.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Asia/Tokyo
    # Wait for new releases to settle before updating because Dependabot PRs are merged automatically. Security updates
    # aren’t delayed.
    cooldown:
      default-days: 7
    allow:
      - dependency-type: all
    groups:
      eslint:
        patterns:
          - "@eslint-community/*"
          - "@eslint/*"
          - "eslint"
          - "eslint-*"
    open-pull-requests-limit: 15
